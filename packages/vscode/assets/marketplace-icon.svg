    <rect x="26" y="26" width="34" height="34" rx="5"/>
    <rect x="68" y="68" width="34" height="34" rx="5"/>
  </g>
  <g fill="#4ea3ff">
    <rect x="68" y="26" width="34" height="34" rx="5"/>
    <rect x="26" y="68" width="34" height="34" rx="5"/>
  </g>
</svg>
