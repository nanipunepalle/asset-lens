<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset="1" stop-color="#1b2334"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- viewfinder framing the fingerprint -->
  <g stroke="#8ba3c7" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M20 40V20h20"/>
    <path d="M88 20h20v20"/>
    <path d="M108 88v20H88"/>
    <path d="M40 108H20V88"/>
  </g>

  <!-- hash-bit fingerprint: matched bits filled, the one that differs is a ring -->
  <g fill="#4ea3ff">
    <circle cx="44" cy="44" r="5"/>
    <circle cx="76" cy="44" r="5"/>
    <circle cx="60" cy="60" r="5"/>
    <circle cx="92" cy="60" r="5"/>
    <circle cx="44" cy="76" r="5"/>
    <circle cx="92" cy="76" r="5"/>
    <circle cx="60" cy="92" r="5"/>
    <circle cx="76" cy="92" r="5"/>
  </g>
  <circle cx="76" cy="60" r="7" fill="none" stroke="#7fe7ff" stroke-width="4"/>
</svg>
